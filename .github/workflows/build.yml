name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches CMake version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\([^)]*VERSION\s+(\d+\.\d+\.\d+)') {
            throw 'VERSION not found in CMakeLists.txt'
          }
          $tagVersion = '${{ steps.version.outputs.VERSION }}'
          if ($Matches[1] -ne $tagVersion) {
            throw "Tag version $tagVersion does not match CMake version $($Matches[1])"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 墨点 Inkdot v${{ steps.version.outputs.VERSION }}
          body: |
            ## 墨点 Inkdot v${{ steps.version.outputs.VERSION }}

            **轻落一笔，清爽阅读。**

            墨点是适用于 Windows 的极轻量 Markdown 与 Mermaid 阅读/编辑器。

            ### 使用
            1. 下载下方单文件便携版 `inkdot.exe`
            2. 直接运行并打开 `.md`、`.markdown` 或 `.mmd` 文件
            3. 按 `Ctrl+E` 编辑；双击 `Ctrl` 查看完整快捷键面板
            4. 可选：运行 `inkdot.exe /register` 注册文件关联

            ### 本版亮点
            - YAML Front Matter 原生渲染
            - 简体中文/英文界面跟随 Windows 系统语言
            - `Ctrl+E` 编辑与双击 `Ctrl` 快捷键面板
            - Mermaid flowchart/graph 原生渲染
            - Direct2D 硬件加速，单文件低于 1 MiB

            > 便携版尚未进行代码签名，首次运行可能触发 Windows SmartScreen。
          files: build/Release/inkdot.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional Microsoft Store publishing for Inkdot. Configure a new Partner Center app first.
  # Skips itself until the MSSTORE_* secrets are configured — see packaging/msix/README notes.
  store:
    runs-on: windows-latest
    needs: build
    env:
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_APP_ID: ${{ secrets.MSSTORE_APP_ID }}

    steps:
      - name: Check Store credentials
        id: gate
        shell: bash
        run: |
          if [ -n "$MSSTORE_CLIENT_SECRET" ] && [ -n "$MSSTORE_APP_ID" ]; then
            echo "on=true" >> $GITHUB_OUTPUT
          else
            echo "on=false" >> $GITHUB_OUTPUT
            echo "MSSTORE_* secrets not set - skipping Store publish."
          fi

      - name: Checkout code
        if: steps.gate.outputs.on == 'true'
        uses: actions/checkout@v4

      - name: Download release asset
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\Release | Out-Null
          gh release download $env:GITHUB_REF_NAME --pattern inkdot.exe --output build\Release\inkdot.exe --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack MSIX
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: pwsh -File packaging/msix/pack.ps1 -ExePath build/Release/inkdot.exe

      - name: Setup Microsoft Store CLI
        if: steps.gate.outputs.on == 'true'
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Store CLI
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET

      - name: Publish to Microsoft Store
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          $msix = Get-ChildItem packaging/msix/out/inkdot-*.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId $env:MSSTORE_APP_ID
